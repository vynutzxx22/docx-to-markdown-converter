name: Bug report
description: Report a conversion or application problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem clearly.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: 1.0.0
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use an anonymized sample document. Do not attach confidential files.
