name: Build Windows EXE and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build portable EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "DOCX-to-Markdown-Converter" app.py

      - name: Verify executable
        run: |
          if (!(Test-Path "dist/DOCX-to-Markdown-Converter.exe")) { throw "EXE build output not found." }
          Get-Item "dist/DOCX-to-Markdown-Converter.exe" | Format-List Name,Length

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/DOCX-to-Markdown-Converter.exe
